<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI يحلها سوريا</title><style>
body{font-family:Arial;margin:0;background:#f5f7fb;color:#17202a}header{background:#101828;color:white;padding:24px}main{max-width:950px;margin:auto;padding:18px}.card{background:white;border:1px solid #e2e7ef;border-radius:15px;padding:18px;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 10px;border:1px solid #ccd5e2;border-radius:9px}button{padding:11px 15px;border:0;border-radius:9px;background:#101828;color:white;cursor:pointer}.hidden{display:none}.price{font-size:25px;font-weight:bold}.warn{background:#fff4ce;padding:12px;border-radius:9px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:right}</style>
<header><main style="padding:0"><h1>🤖 AI يحلها 🇸🇾</h1><div>اشرح مشكلتك → حل بالذكاء الاصطناعي → دفع محلي → تنفيذ</div></main></header><main>
<section id="client"><div class="card"><h2>لديك مشكلة في عملك؟</h2><input id="name" placeholder="اسمك أو اسم نشاطك"><input id="contact" placeholder="WhatsApp أو وسيلة التواصل"><input id="link" placeholder="رابط صفحتك (اختياري)"><textarea id="problem" rows="5" placeholder="اشرح المشكلة"></textarea><button onclick="analyze()">🧠 حلّل مشكلتي</button></div><div id="result" class="card hidden"></div><div id="payment" class="card hidden"></div></section>
<section id="admin" class="hidden"><div class="card"><h2>لوحة الإدارة</h2><div id="data"></div></div></section></main>
<script>
let lead,order;
function service(p){if(/مطعم|أكل|طعام/.test(p))return["AI محتوى للمطاعم",120000];if(/متجر|منتج|بيع|ملابس|إلكترونيات/.test(p))return["AI محتوى المنتجات",150000];if(/واتساب|رسائل|عملاء|مبيعات/.test(p))return["AI تنظيم العملاء والردود",180000];return["AI تحليل وحل مشكلة النشاط",100000]}
async function analyze(){let name=document.getElementById("name").value.trim(),contact=document.getElementById("contact").value.trim(),link=document.getElementById("link").value.trim(),problem=document.getElementById("problem").value.trim();if(!name||!contact||!problem)return alert("أكمل البيانات");let r=await fetch("/api/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,contact,link,problem})});lead=await r.json();let s=service(problem);document.getElementById("result").classList.remove("hidden");document.getElementById("result").innerHTML="<h2>الحل المقترح</h2><p>"+s[0]+"</p><p class='price'>"+s[1].toLocaleString()+" ل.س</p><button onclick='buy()'>أريد تنفيذ الحل</button>"}
async function buy(){let s=service(lead.problem),r=await fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lead_id:lead.id,service:s[0],price:s[1]})});order=await r.json();document.getElementById("payment").classList.remove("hidden");document.getElementById("payment").innerHTML="<h2>🇸🇾 الدفع عبر شام كاش</h2><div class='warn'>ضع QR حسابك في static/shamcash_qr.png. هذه النسخة لا تستخدم API. تحقق من وصول المال بنفسك قبل التنفيذ.</div><p>رقم الطلب: <b>"+order.id+"</b></p><p>المبلغ: <b>"+order.price.toLocaleString()+" ل.س</b></p><button onclick='sent()'>دفعت — أرسل للمراجعة</button>"}
function sent(){document.getElementById("payment").innerHTML+="<p>تم تسجيل الطلب بانتظار التحقق اليدوي.</p>"}
async function admin(){let r=await fetch("/api/admin"),d=await r.json();let l=d.leads.map(x=>"<tr><td>"+x.id+"</td><td>"+x.name+"</td><td>"+x.contact+"</td><td>"+x.problem+"</td></tr>").join(""),o=d.orders.map(x=>"<tr><td>"+x.id+"</td><td>"+x.service+"</td><td>"+x.price.toLocaleString()+"</td><td>"+x.status+"</td><td><button onclick='verify(""+x.id+"")'>تحقق</button></td></tr>").join("");document.getElementById("data").innerHTML="<h3>Leads</h3><table><tr><th>ID</th><th>الاسم</th><th>التواصل</th><th>المشكلة</th></tr>"+l+"</table><h3>Orders</h3><table><tr><th>ID</th><th>الخدمة</th><th>المبلغ</th><th>الحالة</th><th></th></tr>"+o+"</table>"}
async function verify(id){await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({order_id:id})});admin()}
if(location.pathname==="/admin"){document.getElementById("client").classList.add("hidden");document.getElementById("admin").classList.remove("hidden");admin()}
</script>
